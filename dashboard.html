<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة تحكم البائع - تحليلات</title>
    <link rel="stylesheet" href="style.css">
    <style>
        /* أنماط إضافية للوحة التحليلية */
        .dashboard {
            max-width: 1200px;
            margin: 0 auto;
        }
        .charts-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 20px;
            margin: 30px 0;
        }
        .chart-card {
            background: var(--glass-bg);
            backdrop-filter: blur(10px);
            border-radius: var(--border-radius);
            padding: 20px;
            box-shadow: var(--shadow);
        }
        .chart-title {
            font-size: 1.2rem;
            margin-bottom: 15px;
            color: var(--text-primary);
        }
        .bar-chart {
            display: flex;
            align-items: flex-end;
            gap: 10px;
            height: 200px;
            padding: 10px 0;
        }
        .bar-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 5px;
        }
        .bar {
            width: 100%;
            background: linear-gradient(180deg, var(--accent), var(--accent-light));
            border-radius: 12px 12px 0 0;
            transition: height 0.3s ease;
            min-height: 4px;
        }
        .bar-label {
            font-size: 0.8rem;
            color: var(--text-secondary);
        }
        .recent-activities {
            background: var(--glass-bg);
            backdrop-filter: blur(10px);
            border-radius: var(--border-radius);
            padding: 20px;
            margin-top: 30px;
            box-shadow: var(--shadow);
        }
        .activity-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
        }
        .activity-table th {
            text-align: right;
            padding: 12px 8px;
            color: var(--text-secondary);
            font-weight: 500;
            border-bottom: 1px solid var(--text-secondary);
        }
        .activity-table td {
            padding: 12px 8px;
            border-bottom: 1px solid rgba(128,128,128,0.2);
        }
        .activity-table tr:hover {
            background: rgba(99,102,241,0.1);
        }
        .badge {
            background: var(--accent);
            color: white;
            padding: 4px 8px;
            border-radius: 40px;
            font-size: 0.75rem;
        }
        @media (min-width: 768px) {
            .charts-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }
    </style>
</head>
<body class="light-mode">
    <header class="header">
        <div class="logo">📁 Digital<span>Market</span></div>
        <div class="header-actions">
            <button class="cart-btn" onclick="window.location.href='cart.html'">
                <span class="cart-icon"></span>
                <span class="cart-count" id="cart-count">0</span>
            </button>
            <button class="mode-toggle" id="mode-toggle" aria-label="تبديل الوضع الليلي"></button>
        </div>
    </header>

    <main class="dashboard">
        <h1>لوحة التحكم التحليلية</h1>
        
        <!-- بطاقات الإحصائيات السريعة -->
        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-icon products-icon"></div>
                <div>
                    <p class="stat-label">عدد المنتجات</p>
                    <p class="stat-value" id="total-products">0</p>
                </div>
            </div>
            <div class="stat-card">
                <div class="stat-icon earnings-icon"></div>
                <div>
                    <p class="stat-label">إجمالي الأرباح</p>
                    <p class="stat-value" id="total-earnings">0 $</p>
                </div>
            </div>
        </div>

        <div class="dashboard-actions">
            <button class="btn-primary" onclick="window.location.href='add-item.html'">➕ إضافة منتج جديد</button>
        </div>

        <!-- الرسوم البيانية -->
        <div class="charts-grid">
            <div class="chart-card">
                <h3 class="chart-title">المبيعات اليومية (آخر 7 أيام)</h3>
                <div class="bar-chart" id="dailySalesChart"></div>
            </div>
            <div class="chart-card">
                <h3 class="chart-title">الأرباح الشهرية</h3>
                <div class="bar-chart" id="monthlyEarningsChart"></div>
            </div>
        </div>

        <!-- سجل العمليات الأخير -->
        <div class="recent-activities">
            <h3>آخر العمليات</h3>
            <table class="activity-table">
                <thead>
                    <tr>
                        <th>المنتج</th>
                        <th>المشتري</th>
                        <th>السعر</th>
                        <th>التاريخ</th>
                    </tr>
                </thead>
                <tbody id="activity-list">
                    <!-- يتم تعبئتها بواسطة JavaScript -->
                </tbody>
            </table>
        </div>

        <h2>المنتجات الحالية</h2>
        <div class="product-list" id="product-list">
            <!-- يتم تعبئتها بالمنتجات مع خيار حذف -->
        </div>
    </main>

    <footer>
        <p>© 2025 سوق الملفات الرقمية</p>
    </footer>

    <script src="data.js"></script>
    <script src="app.js"></script>
    <script>
        // تجاوز دالة loadDashboard لتضمين الرسوم البيانية وسجل العمليات
        function loadDashboard() {
            const products = JSON.parse(localStorage.getItem('products')) || [];
            const sellerStats = JSON.parse(localStorage.getItem('sellerStats')) || { totalEarnings: 1250.75, totalSales: 87 };
            
            document.getElementById('total-products').textContent = products.length;
            document.getElementById('total-earnings').textContent = sellerStats.totalEarnings.toFixed(2) + ' $';
            
            // عرض المنتجات الحالية مع خيار الحذف
            const productList = document.getElementById('product-list');
            if (productList) {
                productList.innerHTML = '';
                products.forEach(product => {
                    const item = document.createElement('div');
                    item.className = 'product-list-item';
                    item.innerHTML = `
                        <div>
                            <strong>${product.name}</strong> - ${product.price} $
                        </div>
                        <button class="delete-product" data-id="${product.id}">حذف</button>
                    `;
                    productList.appendChild(item);
                });
                
                document.querySelectorAll('.delete-product').forEach(btn => {
                    btn.addEventListener('click', (e) => {
                        const id = parseInt(e.target.dataset.id);
                        deleteProduct(id);
                    });
                });
            }
            
            // رسم المخططات
            renderDailySalesChart();
            renderMonthlyEarningsChart();
            
            // عرض آخر العمليات
            renderRecentActivities();
        }

        // دالة حذف منتج (تعديل لتعيد تحميل الصفحة بعد الحذف)
        function deleteProduct(id) {
            let products = JSON.parse(localStorage.getItem('products')) || [];
            products = products.filter(p => p.id !== id);
            localStorage.setItem('products', JSON.stringify(products));
            // تحديث الإحصائيات بشكل وهمي
            let stats = JSON.parse(localStorage.getItem('sellerStats')) || { totalEarnings: 1250.75, totalSales: 87 };
            stats.totalEarnings -= 10; // طرح وهمي
            localStorage.setItem('sellerStats', JSON.stringify(stats));
            loadDashboard(); // إعادة تحميل البيانات
        }

        // رسم المبيعات اليومية (بيانات وهمية)
        function renderDailySalesChart() {
            const days = ['الأحد', 'الإثنين', 'الثلاثاء', 'الأربعاء', 'الخميس', 'الجمعة', 'السبت'];
            // بيانات مبيعات وهمية (عدد المبيعات)
            const salesData = [12, 19, 8, 15, 22, 27, 18];
            const maxSales = Math.max(...salesData);
            
            const chartContainer = document.getElementById('dailySalesChart');
            chartContainer.innerHTML = '';
            
            days.forEach((day, index) => {
                const barHeight = (salesData[index] / maxSales) * 150; // أقصى ارتفاع 150px
                const barContainer = document.createElement('div');
                barContainer.className = 'bar-container';
                barContainer.innerHTML = `
                    <div class="bar" style="height: ${barHeight}px;"></div>
                    <span class="bar-label">${day.slice(0,2)}</span>
                    <span class="bar-label" style="font-size:0.7rem;">${salesData[index]}</span>
                `;
                chartContainer.appendChild(barContainer);
            });
        }

        // رسم الأرباح الشهرية (بيانات وهمية)
        function renderMonthlyEarningsChart() {
            const months = ['يناير', 'فبراير', 'مارس', 'أبريل', 'مايو', 'يونيو'];
            const earningsData = [450, 620, 380, 710, 890, 540]; // أرباح وهمية
            const maxEarnings = Math.max(...earningsData);
            
            const chartContainer = document.getElementById('monthlyEarningsChart');
            chartContainer.innerHTML = '';
            
            months.forEach((month, index) => {
                const barHeight = (earningsData[index] / maxEarnings) * 150;
                const barContainer = document.createElement('div');
                barContainer.className = 'bar-container';
                barContainer.innerHTML = `
                    <div class="bar" style="height: ${barHeight}px;"></div>
                    <span class="bar-label">${month.slice(0,3)}</span>
                    <span class="bar-label" style="font-size:0.7rem;">${earningsData[index]}$</span>
                `;
                chartContainer.appendChild(barContainer);
            });
        }

        // عرض آخر العمليات (بيانات وهمية)
        function renderRecentActivities() {
            const activities = [
                { product: 'قالب متجر إلكتروني', buyer: 'أحمد محمد', price: 49.99, date: '2025-03-09' },
                { product: 'كتيب تعلم JavaScript', buyer: 'سارة خالد', price: 29.99, date: '2025-03-08' },
                { product: 'مكتبة تايمر متقدمة', buyer: 'عمر حسن', price: 19.99, date: '2025-03-07' },
                { product: 'موسيقى تصويرية هادئة', buyer: 'نورة عبدالله', price: 9.99, date: '2025-03-06' },
                { product: 'قالب متجر إلكتروني', buyer: 'فيصل القحطاني', price: 49.99, date: '2025-03-05' }
            ];
            
            const tbody = document.getElementById('activity-list');
            tbody.innerHTML = '';
            activities.forEach(act => {
                const row = document.createElement('tr');
                row.innerHTML = `
                    <td>${act.product}</td>
                    <td>${act.buyer}</td>
                    <td>${act.price} $</td>
                    <td>${act.date}</td>
                `;
                tbody.appendChild(row);
            });
        }

        document.addEventListener('DOMContentLoaded', function() {
            loadDashboard();
            updateCartCount();
        });
    </script>
</body>
</html>
