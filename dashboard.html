<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة تحكم البائع</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="light-mode">
    <header class="header">
        <div class="logo">📁 Digital<span>Market</span></div>
        <div class="header-actions">
            <button class="cart-btn" onclick="window.location.href='cart.html'">
                <span class="cart-icon"></span>
                <span class="cart-count" id="cart-count">0</span>
            </button>
            <button class="mode-toggle" id="mode-toggle" aria-label="تبديل الوضع الليلي"></button>
        </div>
    </header>

    <main class="dashboard">
        <h1>لوحة التحكم</h1>
        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-icon products-icon"></div>
                <div>
                    <p class="stat-label">عدد المنتجات</p>
                    <p class="stat-value" id="total-products">0</p>
                </div>
            </div>
            <div class="stat-card">
                <div class="stat-icon earnings-icon"></div>
                <div>
                    <p class="stat-label">إجمالي الأرباح</p>
                    <p class="stat-value" id="total-earnings">0 $</p>
                </div>
            </div>
        </div>

        <div class="dashboard-actions">
            <button class="btn-primary" onclick="window.location.href='add-item.html'">➕ إضافة منتج جديد</button>
        </div>

        <h2>المنتجات الحالية</h2>
        <div class="product-list" id="product-list">
            <!-- يتم تعبئتها بالمنتجات مع خيار حذف -->
        </div>
    </main>

    <footer>
        <p>© 2025 سوق الملفات الرقمية</p>
    </footer>

    <script src="data.js"></script>
    <script src="app.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            loadDashboard();
            updateCartCount();
        });
    </script>
</body>
</html>
