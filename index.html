<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>التسبيح الذكي الإسلامي</title>
    <!-- الخطوط العربية الفاخرة -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700&family=Tajawal:wght@300;400;500;700&display=swap" rel="stylesheet">
    <!-- ربط ملف التنسيق الخارجي -->
    <link rel="stylesheet" href="style.css">
    <!-- ربط الجافاسكربت مع defer لضمان عدم حظر العرض -->
    <script src="script.js" defer></script>
</head>
<body>
    <!-- خلفية Canvas متحركة (سيتم التحكم بها من script.js) -->
    <canvas id="bgCanvas"></canvas>

    <!-- حاوية رئيسية للتطبيق (Single Page Application) -->
    <main id="appContainer">

        <!-- ================== شاشة البداية (Splash) ================== -->
        <section id="splashPage" class="page-section active">
            <div class="splash-content glass-card">
                <img src="https://iili.io/fbw7Nwb.md.jpg" alt="أيقونة التطبيق" class="splash-icon">
                <h1 class="app-name">التسبيح الذكي</h1>
                <p class="app-description">سبح مع الذكاء الروحاني</p>
                <!-- شريط التحميل الذي يظهر فقط إذا كان المستخدم مسجلاً مسبقاً -->
                <div id="splashProgressContainer" class="progress-container hidden">
                    <div id="splashProgressBar" class="progress-bar"></div>
                </div>
                <!-- تم نقل حقوق النشر إلى الفوتر العام -->
            </div>
        </section>

        <!-- ================== شاشة المصادقة (Auth) ================== -->
        <section id="authPage" class="page-section hidden">
            <div class="auth-container glass-card">
                <!-- رأس الأيقونة -->
                <img src="https://iili.io/fbw7Nwb.md.jpg" alt="أيقونة" class="auth-icon">
                <h2 id="authTitle">إنشاء حساب</h2>
                <!-- نموذج موحد للتسجيل والدخول مع تبديل الحقول ديناميكياً -->
                <form id="authForm">
                    <!-- حقول مشتركة -->
                    <div id="nameField" class="input-field">
                        <label for="fullName">الاسم الكامل</label>
                        <input type="text" id="fullName" placeholder="محمد الإسلام" autocomplete="off">
                    </div>
                    <div class="input-field">
                        <label for="username">اسم المستخدم</label>
                        <input type="text" id="username" placeholder="user123" autocomplete="off">
                    </div>
                    <div class="input-field">
                        <label for="password">كلمة المرور</label>
                        <input type="password" id="password" placeholder="••••••••">
                    </div>
                    <div id="confirmField" class="input-field">
                        <label for="confirmPassword">تأكيد كلمة المرور</label>
                        <input type="password" id="confirmPassword" placeholder="••••••••">
                    </div>
                    <!-- رسالة خطأ -->
                    <div id="authMessage" class="auth-message"></div>
                    <!-- أزرار التحكم -->
                    <button type="submit" id="authSubmit" class="glow-button" aria-label="إرسال النموذج">تسجيل</button>
                    <button type="button" id="authToggle" class="link-button" aria-label="تبديل وضع المصادقة">لدي حساب بالفعل</button>
                </form>
            </div>
        </section>

        <!-- ================== التطبيق الرئيسي (Main App) ================== -->
        <section id="mainAppPage" class="page-section hidden">
            <!-- شريط التبويبات (Tabs) -->
            <nav class="tab-bar glass-card" aria-label="التبويبات الرئيسية">
                <button id="tabTasbeeh" class="tab-btn active" data-tab="tasbeeh" aria-label="التسبيح الذكي">
                    <img src="https://iili.io/fbw7Nwb.md.jpg" alt="" class="icon-img"> الذكي
                </button>
                <button id="tabFatimah" class="tab-btn" data-tab="fatimah" aria-label="تسبيح فاطمة الزهراء">
                    <img src="https://iili.io/fbw7Nwb.md.jpg" alt="" class="icon-img"> فاطمة
                </button>
            </nav>

            <!-- محتوى التبويبات -->
            <div id="tabContent" class="tab-content">
                <!-- قسم التسبيح الذكي -->
                <section id="tasbeehContent" class="tab-pane active">
                    <div class="counter-main glass-card">
                        <span id="smartCounter" class="big-counter">0</span>
                        <button id="smartIncrementBtn" class="action-btn main-btn" aria-label="زيادة العداد">
                            <img src="https://iili.io/fbw7Nwb.md.jpg" alt="" class="icon-img"> اضغط هنا
                        </button>
                    </div>
                    <div class="action-bar glass-card">
                        <button id="smartStatsBtn" class="icon-btn" aria-label="عرض الإحصائيات">
                            <img src="https://iili.io/fbw7Nwb.md.jpg" alt=""> ☆
                        </button>
                        <button id="smartResetBtn" class="icon-btn" aria-label="تصفير العداد">
                            <img src="https://iili.io/fbw7Nwb.md.jpg" alt=""> تصفير
                        </button>
                        <button id="smartHistoryBtn" class="icon-btn" aria-label="عرض السجل">
                            <img src="https://iili.io/fbw7Nwb.md.jpg" alt=""> السجل
                        </button>
                        <button id="smartTopBtn" class="icon-btn" aria-label="عرض أفضل 100">
                            <img src="https://iili.io/fbw7Nwb.md.jpg" alt=""> Top 100
                        </button>
                    </div>
                </section>

                <!-- قسم تسبيح فاطمة الزهراء -->
                <section id="fatimahContent" class="tab-pane hidden">
                    <div class="fatimah-status glass-card">
                        <div class="phase-indicator">
                            <span id="fatimahPhaseLabel">الله أكبر</span>
                            <span id="fatimahPhaseCount" class="phase-count">0/34</span>
                        </div>
                        <div class="cycle-counter">
                            <span>عدد الختمات: </span><span id="fatimahCycles">0</span>
                        </div>
                        <button id="fatimahIncrementBtn" class="action-btn main-btn" aria-label="زيادة عداد فاطمة">
                            <img src="https://iili.io/fbw7Nwb.md.jpg" alt="" class="icon-img"> اضغط هنا
                        </button>
                        <div class="action-bar">
                            <button id="fatimahResetBtn" class="icon-btn" aria-label="إعادة تعيين تسبيح فاطمة">
                                <img src="https://iili.io/fbw7Nwb.md.jpg" alt=""> إعادة
                            </button>
                            <button id="fatimahTopBtn" class="icon-btn" aria-label="أفضل 100 ختمة">
                                <img src="https://iili.io/fbw7Nwb.md.jpg" alt=""> Top 100
                            </button>
                        </div>
                    </div>
                </section>
            </div>
            <!-- تم نقل الفوتر القديم إلى الفوتر العام -->
        </section>

        <!-- ================== شاشة Top 100 (Full screen) ================== -->
        <section id="top100Page" class="page-section hidden fullscreen-top">
            <header class="top-header glass-card">
                <button id="backFromTop" class="icon-btn" aria-label="العودة للتطبيق الرئيسي">
                    <img src="https://iili.io/fbw7Nwb.md.jpg" alt=""> رجوع
                </button>
                <h2>أفضل 100</h2>
            </header>
            <nav class="top-tabs" aria-label="تبويبات أفضل 100">
                <button id="topTotalTab" class="tab-btn active">الإجمالي</button>
                <button id="topSessionTab" class="tab-btn">أعلى جلسة</button>
                <button id="topFatimahTab" class="tab-btn">ختمات فاطمة</button>
            </nav>
            <div id="topTotalList" class="top-list active"></div>
            <div id="topSessionList" class="top-list hidden"></div>
            <div id="topFatimahList" class="top-list hidden"></div>
        </section>

        <!-- ================== الفوتر العام الثابت (يظهر في جميع الصفحات) ================== -->
        <footer class="app-footer glass-card">
            <div class="footer-main">
                <span class="copyright">جلال 2026 ©</span>
                <!-- عداد الزوار الكلي بالمعرف المطلوب total-visitors-count -->
                <div class="visitor-counter">
                    <img src="https://iili.io/fbw7Nwb.md.jpg" alt="أيقونة الزوار" class="visitor-icon">
                    <span>إجمالي الزوار: <span id="total-visitors-count">0</span></span>
                </div>
                <!-- روابط التنقل السفلية (Bottom Navigation) -->
                <nav class="bottom-nav" aria-label="القائمة السفلية">
                    <button id="bottomNavHome" class="bottom-nav-btn" aria-label="الرئيسية">
                        <img src="https://iili.io/fbw7Nwb.md.jpg" alt=""> الرئيسية
                    </button>
                    <button id="bottomNavTasbeeh" class="bottom-nav-btn" aria-label="التسبيح الذكي">
                        <img src="https://iili.io/fbw7Nwb.md.jpg" alt=""> الذكي
                    </button>
                    <button id="bottomNavFatimah" class="bottom-nav-btn" aria-label="تسبيح فاطمة">
                        <img src="https://iili.io/fbw7Nwb.md.jpg" alt=""> فاطمة
                    </button>
                    <button id="bottomNavTop100" class="bottom-nav-btn" aria-label="أفضل 100">
                        <img src="https://iili.io/fbw7Nwb.md.jpg" alt=""> Top 100
                    </button>
                </nav>
                <!-- روابط خارجية (تليجرام والموقع الشخصي) -->
                <div class="external-links">
                    <a href="https://black3web.github.io/Blackweb/" target="_blank" class="footer-link" aria-label="الموقع الشخصي">
                        <img src="https://iili.io/fbw7Nwb.md.jpg" alt="">
                    </a>
                    <a href="https://t.me/swc_t" target="_blank" class="footer-link" aria-label="قناة التليجرام">
                        <img src="https://iili.io/fbw7Nwb.md.jpg" alt="">
                    </a>
                </div>
            </div>
        </footer>

        <!-- ================== النوافذ المنبثقة (Modal) ================== -->
        <!-- نافذة الإحصائيات (☆) -->
        <div id="statsModal" class="modal hidden">
            <div class="modal-content glass-card">
                <span class="close-modal" aria-label="إغلاق">&times;</span>
                <h3>إحصائياتك</h3>
                <p>أعلى رقم في جلسة: <span id="statsMaxSession">0</span> (<span id="statsMaxSessionDate"></span>)</p>
                <p>إجمالي الضغطات: <span id="statsTotalClicks">0</span></p>
            </div>
        </div>

        <!-- نافذة السجل (History) -->
        <div id="historyModal" class="modal hidden">
            <div class="modal-content glass-card large-modal">
                <span class="close-modal" aria-label="إغلاق">&times;</span>
                <h3>سجل التصفيرات</h3>
                <ul id="historyList" class="history-list"></ul>
            </div>
        </div>

    </main>

    <!-- ملاحظة: تم نقل استدعاء السكربت إلى <head> مع خاصية defer -->
</body>
</html>
