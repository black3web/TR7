<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>سوق الملفات الرقمية</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="light-mode">
    <header class="header">
        <div class="logo">📁 Digital<span>Market</span></div>
        <div class="header-actions">
            <button class="cart-btn" onclick="window.location.href='cart.html'">
                <span class="cart-icon"></span>
                <span class="cart-count" id="cart-count">0</span>
            </button>
            <button class="mode-toggle" id="mode-toggle" aria-label="تبديل الوضع الليلي"></button>
        </div>
    </header>

    <main>
        <section class="hero">
            <h1>الملفات الرقمية الإبداعية <br> <span>بأفضل الأسعار</span></h1>
            <p>أكثر من 500 قالب وكتاب إلكتروني وأداة رقمية جاهزة للتحميل الفوري</p>
            <button class="btn-primary" onclick="window.location.href='#products'">تصفح المنتجات</button>
        </section>

        <section class="categories">
            <h2>التصنيفات</h2>
            <div class="category-grid">
                <div class="category-item">
                    <div class="icon icon-pdf"></div>
                    <span>كتب إلكترونية</span>
                </div>
                <div class="category-item">
                    <div class="icon icon-code"></div>
                    <span>أكواد برمجية</span>
                </div>
                <div class="category-item">
                    <div class="icon icon-design"></div>
                    <span>قوالب تصميم</span>
                </div>
                <div class="category-item">
                    <div class="icon icon-audio"></div>
                    <span>موسيقى خالية</span>
                </div>
            </div>
        </section>

        <section class="products" id="products">
            <h2>أحدث المنتجات</h2>
            <div class="product-grid" id="product-grid">
                <!-- يتم تعبئتها بواسطة JavaScript -->
            </div>
        </section>
    </main>

    <footer>
        <p>© 2025 سوق الملفات الرقمية - جميع الحقوق محفوظة</p>
    </footer>

    <script src="data.js"></script>
    <script src="app.js"></script>
    <script>
        // عرض المنتجات في الصفحة الرئيسية
        document.addEventListener('DOMContentLoaded', function() {
            displayProductsOnIndex();
            updateCartCount();
        });
    </script>
</body>
</html>
