<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>التسبيح الذكي الإسلامي</title>
    <!-- الخطوط العربية الفاخرة -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700&family=Tajawal:wght@300;400;500;700&display=swap" rel="stylesheet">
    <!-- ربط ملفات التنسيق والمنطق (سيتم تضمينها هنا) -->
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- خلفية Canvas متحركة (ستتم برمجتها في JS) -->
    <canvas id="bgCanvas"></canvas>

    <!-- ================== شاشة البداية (Splash) ================== -->
    <div id="splashScreen" class="screen active">
        <div class="splash-content glass-card">
            <img src="https://iili.io/fbw7Nwb.md.jpg" alt="أيقونة التطبيق" class="splash-icon">
            <h1 class="app-name">التسبيح الذكي</h1>
            <p class="app-description">سبح مع الذكاء الروحاني</p>
            <!-- شريط التحميل الذي يظهر فقط إذا كان المستخدم مسجلاً مسبقاً -->
            <div id="splashProgressContainer" class="progress-container hidden">
                <div id="splashProgressBar" class="progress-bar"></div>
            </div>
            <!-- رسالة الحقوق -->
            <div class="footer-copyright">جلال 2026 ©</div>
        </div>
    </div>

    <!-- ================== شاشة المصادقة (Auth) ================== -->
    <div id="authScreen" class="screen hidden">
        <div class="auth-container glass-card">
            <!-- رأس الأيقونة -->
            <img src="https://iili.io/fbw7Nwb.md.jpg" alt="أيقونة" class="auth-icon">
            <h2 id="authTitle">إنشاء حساب</h2>
            <!-- نموذج موحد للتسجيل والدخول مع تبديل الحقول ديناميكياً -->
            <form id="authForm">
                <!-- حقول مشتركة -->
                <div id="nameField" class="input-field">
                    <label for="fullName">الاسم الكامل</label>
                    <input type="text" id="fullName" placeholder="محمد الإسلام" autocomplete="off">
                </div>
                <div class="input-field">
                    <label for="username">اسم المستخدم</label>
                    <input type="text" id="username" placeholder="user123" autocomplete="off">
                </div>
                <div class="input-field">
                    <label for="password">كلمة المرور</label>
                    <input type="password" id="password" placeholder="••••••••">
                </div>
                <div id="confirmField" class="input-field">
                    <label for="confirmPassword">تأكيد كلمة المرور</label>
                    <input type="password" id="confirmPassword" placeholder="••••••••">
                </div>
                <!-- رسالة خطأ -->
                <div id="authMessage" class="auth-message"></div>
                <!-- أزرار التحكم -->
                <button type="submit" id="authSubmit" class="glow-button">تسجيل</button>
                <button type="button" id="authToggle" class="link-button">لدي حساب بالفعل</button>
            </form>
        </div>
    </div>

    <!-- ================== التطبيق الرئيسي (Main App) ================== -->
    <div id="mainApp" class="screen hidden">
        <!-- شريط التبويبات (Tabs) -->
        <div class="tab-bar glass-card">
            <button id="tabTasbeeh" class="tab-btn active" data-tab="tasbeeh">
                <img src="https://iili.io/fbw7Nwb.md.jpg" alt="تسبيح"> الذكي
            </button>
            <button id="tabFatimah" class="tab-btn" data-tab="fatimah">
                <img src="https://iili.io/fbw7Nwb.md.jpg" alt="فاطمة"> فاطمة
            </button>
        </div>

        <!-- محتوى التبويبات -->
        <div id="tabContent" class="tab-content">
            <!-- قسم التسبيح الذكي -->
            <div id="tasbeehContent" class="tab-pane active">
                <div class="counter-main glass-card">
                    <span id="smartCounter" class="big-counter">0</span>
                    <button id="smartIncrementBtn" class="action-btn main-btn">
                        <img src="https://iili.io/fbw7Nwb.md.jpg" alt="اضغط"> اضغط هنا
                    </button>
                </div>
                <div class="action-bar glass-card">
                    <button id="smartStatsBtn" class="icon-btn"><img src="https://iili.io/fbw7Nwb.md.jpg" alt="نجمة"> ☆</button>
                    <button id="smartResetBtn" class="icon-btn"><img src="https://iili.io/fbw7Nwb.md.jpg" alt="تصفير"> تصفير</button>
                    <button id="smartHistoryBtn" class="icon-btn"><img src="https://iili.io/fbw7Nwb.md.jpg" alt="سجل"> السجل</button>
                    <button id="smartTopBtn" class="icon-btn"><img src="https://iili.io/fbw7Nwb.md.jpg" alt="Top 100"> Top 100</button>
                </div>
            </div>

            <!-- قسم تسبيح فاطمة الزهراء -->
            <div id="fatimahContent" class="tab-pane hidden">
                <div class="fatimah-status glass-card">
                    <div class="phase-indicator">
                        <span id="fatimahPhaseLabel">الله أكبر</span>
                        <span id="fatimahPhaseCount" class="phase-count">0/34</span>
                    </div>
                    <div class="cycle-counter">
                        <span>عدد الختمات: </span><span id="fatimahCycles">0</span>
                    </div>
                    <button id="fatimahIncrementBtn" class="action-btn main-btn">
                        <img src="https://iili.io/fbw7Nwb.md.jpg" alt="اضغط"> اضغط هنا
                    </button>
                    <div class="action-bar">
                        <button id="fatimahResetBtn" class="icon-btn"><img src="https://iili.io/fbw7Nwb.md.jpg" alt="إعادة"> إعادة</button>
                        <button id="fatimahTopBtn" class="icon-btn"><img src="https://iili.io/fbw7Nwb.md.jpg" alt="Top 100"> Top 100</button>
                    </div>
                </div>
            </div>
        </div>

        <!-- التذييل الثابت (Footer) -->
        <footer class="app-footer glass-card">
            <span>جلال 2026 ©</span>
            <a href="https://black3web.github.io/Blackweb/" target="_blank" class="footer-link">
                <img src="https://iili.io/fbw7Nwb.md.jpg" alt="موقعي">
            </a>
            <a href="https://t.me/swc_t" target="_blank" class="footer-link">
                <img src="https://iili.io/fbw7Nwb.md.jpg" alt="مشاريعي">
            </a>
        </footer>
    </div>

    <!-- ================== النوافذ المنبثقة (Modals) ================== -->
    <!-- نافذة الإحصائيات (☆) -->
    <div id="statsModal" class="modal hidden">
        <div class="modal-content glass-card">
            <span class="close-modal">&times;</span>
            <h3>إحصائياتك</h3>
            <p>أعلى رقم في جلسة: <span id="statsMaxSession">0</span> (<span id="statsMaxSessionDate"></span>)</p>
            <p>إجمالي الضغطات: <span id="statsTotalClicks">0</span></p>
        </div>
    </div>

    <!-- نافذة السجل (History) -->
    <div id="historyModal" class="modal hidden">
        <div class="modal-content glass-card large-modal">
            <span class="close-modal">&times;</span>
            <h3>سجل التصفيرات</h3>
            <ul id="historyList" class="history-list"></ul>
        </div>
    </div>

    <!-- شاشة Top 100 (Full screen) -->
    <div id="top100Screen" class="screen hidden fullscreen-top">
        <div class="top-header glass-card">
            <button id="backFromTop" class="icon-btn"><img src="https://iili.io/fbw7Nwb.md.jpg" alt="رجوع"> رجوع</button>
            <h2>أفضل 100</h2>
        </div>
        <div class="top-tabs">
            <button id="topTotalTab" class="tab-btn active">الإجمالي</button>
            <button id="topSessionTab" class="tab-btn">أعلى جلسة</button>
            <button id="topFatimahTab" class="tab-btn">ختمات فاطمة</button>
        </div>
        <div id="topTotalList" class="top-list active"></div>
        <div id="topSessionList" class="top-list hidden"></div>
        <div id="topFatimahList" class="top-list hidden"></div>
    </div>

    <script src="script.js"></script>
</body>
</html>
