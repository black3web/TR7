<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تفاصيل المنتج - سوق الملفات الرقمية</title>
    <link rel="stylesheet" href="style.css">
    <style>
        /* أنماط إضافية لصفحة المنتج */
        .product-gallery {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-bottom: 25px;
        }
        .main-image {
            width: 100%;
            height: 250px;
            background: linear-gradient(145deg, var(--accent-light), var(--accent));
            border-radius: var(--border-radius);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 5rem;
            color: white;
            box-shadow: var(--shadow);
        }
        .thumbnail-list {
            display: flex;
            gap: 10px;
            justify-content: center;
        }
        .thumbnail {
            width: 70px;
            height: 70px;
            background: var(--bg-secondary);
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
            cursor: pointer;
            transition: var(--transition);
            border: 2px solid transparent;
            box-shadow: var(--shadow);
        }
        .thumbnail:hover, .thumbnail.active {
            border-color: var(--accent);
            transform: scale(1.05);
        }
        .trust-bar {
            display: flex;
            justify-content: space-around;
            background: var(--glass-bg);
            backdrop-filter: blur(10px);
            padding: 20px;
            border-radius: 60px;
            margin: 30px 0;
            box-shadow: var(--shadow);
        }
        .trust-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 5px;
            font-size: 0.9rem;
        }
        .trust-icon {
            font-size: 2rem;
        }
        .rating-detailed {
            background: var(--glass-bg);
            backdrop-filter: blur(10px);
            padding: 20px;
            border-radius: var(--border-radius);
            margin: 30px 0;
            box-shadow: var(--shadow);
        }
        .rating-row {
            display: flex;
            align-items: center;
            gap: 10px;
            margin: 10px 0;
        }
        .rating-stars {
            min-width: 80px;
            color: #fbbf24;
        }
        .progress-bar-container {
            flex: 1;
            height: 10px;
            background: var(--bg-secondary);
            border-radius: 10px;
            overflow: hidden;
        }
        .progress-bar {
            height: 100%;
            background: linear-gradient(90deg, var(--accent), var(--accent-light));
            border-radius: 10px;
        }
        .rating-percent {
            min-width: 40px;
            text-align: left;
        }
        .live-viewers {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: rgba(239, 68, 68, 0.2);
            color: #ef4444;
            padding: 8px 16px;
            border-radius: 40px;
            font-size: 0.9rem;
            margin: 15px 0;
            backdrop-filter: blur(4px);
        }
        .viewers-dot {
            width: 10px;
            height: 10px;
            background: #ef4444;
            border-radius: 50%;
            animation: pulse 1.5s infinite;
        }
        @keyframes pulse {
            0% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.5; transform: scale(1.2); }
            100% { opacity: 1; transform: scale(1); }
        }
        .related-products {
            margin-top: 50px;
        }
        .related-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-top: 20px;
        }
        .related-card {
            background: var(--glass-bg);
            backdrop-filter: blur(10px);
            padding: 15px;
            border-radius: 20px;
            box-shadow: var(--shadow);
            transition: var(--transition);
            cursor: pointer;
        }
        .related-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 30px -10px var(--accent);
        }
        @media (min-width: 768px) {
            .related-grid {
                grid-template-columns: repeat(3, 1fr);
            }
        }
    </style>
</head>
<body class="light-mode">
    <header class="header" id="mainHeader">
        <div class="logo">📁 Digital<span>Market</span></div>
        <div class="header-actions">
            <button class="cart-btn" onclick="window.location.href='cart.html'">
                <span class="cart-icon"></span>
                <span class="cart-count" id="cart-count">0</span>
            </button>
            <button class="mode-toggle" id="mode-toggle" aria-label="تبديل الوضع الليلي"></button>
        </div>
    </header>

    <main class="product-detail-container" id="product-detail">
        <!-- محتوى ديناميكي يتم حقنه بواسطة JavaScript -->
    </main>

    <footer>
        <p>© 2025 سوق الملفات الرقمية</p>
    </footer>

    <script src="data.js"></script>
    <script src="app.js"></script>
    <script>
        // تجاوز دالة loadProductDetail الأصلية لتضمين الميزات الجديدة
        function loadProductDetail() {
            const params = new URLSearchParams(window.location.search);
            const id = parseInt(params.get('id'));
            const products = JSON.parse(localStorage.getItem('products')) || [];
            const product = products.find(p => p.id === id);
            const container = document.getElementById('product-detail');
            
            if (!container) return;
            
            if (!product) {
                container.innerHTML = '<p>المنتج غير موجود</p>';
                return;
            }

            // بيانات وهمية للتقييمات وعدد المشاهدين
            const ratingsDistribution = {
                5: 45,
                4: 30,
                3: 15,
                2: 7,
                1: 3
            };
            const totalRatings = Object.values(ratingsDistribution).reduce((a, b) => a + b, 0);
            const liveViewers = Math.floor(Math.random() * 15) + 8; // 8-23 مشاهد

            // صور مصغرة وهمية (نستخدم أيقونات)
            const thumbnails = ['📄', '🔍', '⚙️', '📁'];

            // بناء HTML
            let html = `
                <div class="live-viewers">
                    <span class="viewers-dot"></span>
                    <span>👀 ${liveViewers} شخص يشاهدون هذا المنتج الآن</span>
                </div>
                <h1>${product.name}</h1>
                
                <!-- معرض الصور -->
                <div class="product-gallery">
                    <div class="main-image" id="mainImage">${getTypeIcon(product.type)}</div>
                    <div class="thumbnail-list" id="thumbnailList">
                        ${thumbnails.map((icon, index) => `
                            <div class="thumbnail ${index === 0 ? 'active' : ''}" data-icon="${icon}">${icon}</div>
                        `).join('')}
                    </div>
                </div>

                <!-- شريط الثقة -->
                <div class="trust-bar">
                    <div class="trust-item">
                        <span class="trust-icon">🔒</span>
                        <span>تحميل آمن</span>
                    </div>
                    <div class="trust-item">
                        <span class="trust-icon">💬</span>
                        <span>دعم فني 24/7</span>
                    </div>
                    <div class="trust-item">
                        <span class="trust-icon">🔄</span>
                        <span>تحديثات مدى الحياة</span>
                    </div>
                </div>

                <!-- السعر والوصف -->
                <p class="product-price">${product.price} $</p>
                <p>${product.description}</p>
                <p>النوع: ${getTypeName(product.type)}</p>
                <p>تاريخ الإضافة: ${product.date}</p>
                
                <!-- أزرار -->
                <button class="btn-primary add-to-cart" data-id="${product.id}">أضف للسلة</button>
                <button class="btn-secondary" onclick="window.location.href='index.html'">العودة</button>

                <!-- التقييمات المفصلة -->
                <div class="rating-detailed">
                    <h3>تقييمات العملاء</h3>
                    ${[5,4,3,2,1].map(star => {
                        const count = ratingsDistribution[star] || 0;
                        const percent = totalRatings > 0 ? (count / totalRatings * 100).toFixed(0) : 0;
                        return `
                            <div class="rating-row">
                                <span class="rating-stars">${'★'.repeat(star)}${'☆'.repeat(5-star)}</span>
                                <div class="progress-bar-container">
                                    <div class="progress-bar" style="width: ${percent}%"></div>
                                </div>
                                <span class="rating-percent">${percent}%</span>
                            </div>
                        `;
                    }).join('')}
                    <p style="margin-top: 10px;">متوسط التقييم: ${product.rating || 4.5} / 5 (${product.reviews || 0} تقييم)</p>
                </div>
            `;

            container.innerHTML = html;

            // إضافة حدث تغيير الصورة المصغرة
            document.querySelectorAll('.thumbnail').forEach((thumb, index) => {
                thumb.addEventListener('click', function() {
                    document.querySelectorAll('.thumbnail').forEach(t => t.classList.remove('active'));
                    this.classList.add('active');
                    const icon = this.dataset.icon;
                    document.getElementById('mainImage').textContent = icon;
                });
            });

            // ربط زر الإضافة
            document.querySelector('.add-to-cart')?.addEventListener('click', (e) => {
                const id = parseInt(e.target.dataset.id);
                if (typeof addToCart === 'function') {
                    addToCart(id);
                } else {
                    alert('تمت الإضافة (محاكاة)');
                }
            });

            // عرض منتجات ذات صلة
            displayRelatedProducts(product.id, product.type);
        }

        // دالة مساعدة لأيقونة النوع
        function getTypeIcon(type) {
            const icons = {
                ebook: '📚',
                code: '{ }',
                design: '🎨',
                audio: '🎵'
            };
            return icons[type] || '📁';
        }

        // دالة عرض المنتجات ذات الصلة
        function displayRelatedProducts(currentId, currentType) {
            let products = JSON.parse(localStorage.getItem('products')) || [];
            // فلترة: نفس النوع وليس نفس المنتج
            let related = products.filter(p => p.type === currentType && p.id !== currentId);
            // إذا كان العدد قليلاً، نضيف منتجات عشوائية
            if (related.length < 3) {
                const others = products.filter(p => p.type !== currentType && p.id !== currentId);
                related = [...related, ...others].slice(0, 4);
            }
            // خلط عشوائي واختيار أول 3
            related = related.sort(() => 0.5 - Math.random()).slice(0, 3);
            
            const relatedSection = document.createElement('div');
            relatedSection.className = 'related-products';
            relatedSection.innerHTML = '<h3>منتجات ذات صلة</h3><div class="related-grid" id="relatedGrid"></div>';
            
            const container = document.getElementById('product-detail');
            container.appendChild(relatedSection);
            
            const grid = document.getElementById('relatedGrid');
            related.forEach(p => {
                const card = document.createElement('div');
                card.className = 'related-card';
                card.onclick = () => window.location.href = `product.html?id=${p.id}`;
                card.innerHTML = `
                    <div style="font-size: 2rem; text-align: center; margin-bottom: 10px;">${getTypeIcon(p.type)}</div>
                    <h4>${p.name}</h4>
                    <p style="color: var(--accent); font-weight: bold;">${p.price} $</p>
                `;
                grid.appendChild(card);
            });
        }

        // استدعاء الدوال عند تحميل الصفحة
        document.addEventListener('DOMContentLoaded', function() {
            loadProductDetail();
            updateCartCount();
            initDarkMode(); // إذا كانت موجودة في app.js
        });
    </script>
</body>
</html>
